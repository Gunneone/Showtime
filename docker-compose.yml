services:
  app:
    build: .
    container_name: showtime-app
    ports:
      # Published on the loopback only -- nginx terminates TLS on the host and
      # proxies to this port. Binding 0.0.0.0 would expose the container
      # directly, straight past nginx.
      - "127.0.0.1:8082:5001"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-default-secret-key-change-in-production}
      - TMDB_API_KEY=${TMDB_API_KEY}
      # Gunicorn: threaded workers for this IO-bound TMDB proxy. gthread keeps
      # a slow upstream from blocking a whole worker without gevent's SSL
      # monkey-patching. Sized for a 4 vCore / 4 GB host.
      - GUNICORN_WORKERS=4
      - GUNICORN_WORKER_CLASS=gthread
      - GUNICORN_THREADS=8
      - GUNICORN_TIMEOUT=30
      - GUNICORN_GRACEFUL_TIMEOUT=30
      - GUNICORN_MAX_REQUESTS=500
      - GUNICORN_MAX_REQUESTS_JITTER=50
      # Aggregate usage metrics. Lives on the named volume below so the counts
      # survive a rebuild; leave SHOWTIME_ADMIN_TOKEN empty to keep the
      # /admin/usage dashboard disabled (it 404s without a token).
      - METRICS_DB_PATH=/app/data/metrics.db
      - SHOWTIME_ADMIN_TOKEN=${SHOWTIME_ADMIN_TOKEN:-}
    volumes:
      - showtime-data:/app/data
    restart: unless-stopped
    # Reduce healthcheck frequency to avoid performance impact
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    # Use default Docker networking for better DNS resolution
    network_mode: bridge
    # Add DNS configuration for better name resolution
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  showtime-data:
