services:
  showtime:
    build: .
    container_name: showtime-app
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-default-secret-key-change-in-production}
      - TMDB_API_KEY=${TMDB_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - showtime-network

networks:
  showtime-network:
    driver: bridge