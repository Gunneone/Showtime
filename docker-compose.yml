services:
  showtime:
    build: .
    container_name: showtime-app
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-default-secret-key-change-in-production}
      - TMDB_API_KEY=${TMDB_API_KEY}
      # Optimized Gunicorn configuration (using sync workers to avoid gevent SSL issues)
      - GUNICORN_WORKERS=2
      - GUNICORN_WORKER_CLASS=sync
      - GUNICORN_TIMEOUT=60
      - GUNICORN_MAX_REQUESTS=500
      - GUNICORN_MAX_REQUESTS_JITTER=50
      # Aggregate usage metrics. Lives on the named volume below so the counts
      # survive a rebuild; leave SHOWTIME_ADMIN_TOKEN empty to keep the
      # /admin/usage dashboard disabled (it 404s without a token).
      - METRICS_DB_PATH=/app/data/metrics.db
      - SHOWTIME_ADMIN_TOKEN=${SHOWTIME_ADMIN_TOKEN:-}
    volumes:
      - showtime-data:/app/data
    restart: unless-stopped
    # Reduce healthcheck frequency to avoid performance impact
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    # Use default Docker networking for better DNS resolution
    network_mode: bridge
    # Add DNS configuration for better name resolution
    dns:
      - 8.8.8.8
      - 8.8.4.4

volumes:
  showtime-data:
