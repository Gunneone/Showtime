services:
  showtime:
    build: .
    container_name: showtime-app
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-default-secret-key-change-in-production}
      - TMDB_API_KEY=${TMDB_API_KEY}
      # Optimized Gunicorn configuration for network-bound workloads
      - GUNICORN_WORKERS=2
      - GUNICORN_WORKER_CLASS=gevent
      - GUNICORN_WORKER_CONNECTIONS=1000
      - GUNICORN_TIMEOUT=60
      - GUNICORN_MAX_REQUESTS=500
      - GUNICORN_MAX_REQUESTS_JITTER=50
    restart: unless-stopped
    # Add resource limits to prevent resource exhaustion
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    # Reduce healthcheck frequency to avoid performance impact
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    # Use default Docker networking for better DNS resolution
    network_mode: bridge
    # Add DNS configuration for better name resolution
    dns:
      - 8.8.8.8
      - 8.8.4.4