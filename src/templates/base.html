<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Showtime - Track Your TV Time{% endblock %}</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.ico') }}">
    
    <!-- canvas-confetti -->
    <script src="{{ url_for('static', filename='js/confetti.browser.min.js') }}"></script>
    
    {% block head %}{% endblock %}
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <h1 class="logo">
                    <a href="{{ url_for('main.index') }}" aria-label="Showtime home">
                        <i class="fas fa-tv" aria-hidden="true"></i>&nbsp;&nbsp;<span class="logo-text">Showtime</span>
                    </a>
                </h1>
                <nav class="nav">
                    <a href="{{ url_for('main.index') }}" class="nav-link">Home</a>
                    <a href="{{ url_for('main.stats') }}" class="nav-link">Statistics</a>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main">
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <p>&copy; 2025 Showtime. Made with ❤️ for TV lovers.</p>
                <p>Data provided by <a href="https://www.themoviedb.org" target="_blank" rel="noopener">The Movie Database</a></p>
                <p><a href="{{ url_for('main.privacy') }}">Privacy</a></p>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/easter-eggs.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
